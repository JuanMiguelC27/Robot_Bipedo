; Pata robotica: brushless (moteus-c1 por CAN) + servos (PCA9685) + encoders (AS5600 por TCA9548A)
; ESP32: SPI del MCP2518FD en D25 SDI, D26 SDO, D27 nCS, D32 INT, D33 SCK; I2C en D21 SDA, D22 SCL
[platformio]
default_envs = esp32dev

; Programa principal (brushless + servos + encoders)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Puerto: PlatformIO lo encuentra solo en Windows (COMx) y en Linux (/dev/ttyUSB0).
; Si encuentra otro, quita el ; y escribe el tuyo:
; upload_port = /dev/ttyUSB0      ; en Windows, por ejemplo: COM5
; monitor_port = /dev/ttyUSB0
upload_speed = 921600

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_src_filter = +<*> -<diagnostico/>

lib_ldf_mode = deep+
lib_deps =
    SPI
    Wire
    https://github.com/pierremolinaro/acan2517FD.git
    https://github.com/mjbots/moteus-arduino.git

; Diagnostico del PCA9685:  pio run -e diag_pca -t upload -t monitor
[env:diag_pca]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_src_filter = -<*> +<diagnostico/diag_pca9685.cpp>