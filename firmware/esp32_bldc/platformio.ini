[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; No fijar /dev/ttyUSB0 ni /dev/ttyUSB1 en este archivo.
; Identificar cada ESP32 mediante /dev/serial/by-id o /dev/serial/by-path.
; Con varias placas conectadas, especificar --upload-port al cargar.

lib_ldf_mode = deep+
lib_deps =
    https://github.com/pierremolinaro/acan2517FD.git
    https://github.com/mjbots/moteus-arduino.git